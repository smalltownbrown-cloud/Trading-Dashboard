<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Merle Trades">
<title>Merle's Trading Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0d0f14; --surface:#13161e; --surface2:#1a1e2a; --border:#252a38;
  --accent:#00d4aa; --accent2:#ff6b35; --accent3:#7b61ff;
  --text:#e8eaf0; --muted:#6b7280; --green:#22c55e; --red:#ef4444; --yellow:#eab308;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;display:flex;flex-direction:column;}
button,input,textarea,select{font-family:inherit;}
button:focus,input:focus,textarea:focus,select:focus{outline:none;}
#header{background:linear-gradient(135deg,#0d0f14,#13161e 60%,#1a1e2a);border-bottom:1px solid var(--border);padding:20px 20px 16px;position:relative;overflow:hidden;flex-shrink:0;}
#header::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(0,212,170,0.08),transparent 70%);border-radius:50%;}
.h-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.2em;color:var(--accent);text-transform:uppercase;margin-bottom:3px;}
.h-title{font-family:'Bebas Neue',impact,sans-serif;font-size:clamp(36px,7vw,54px);letter-spacing:0.04em;line-height:0.95;}
.h-title span{color:var(--accent);}
.h-sub{color:var(--muted);font-size:11px;margin-top:5px;}
.stats{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.stat{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;padding:6px 12px;text-align:center;min-width:50px;}
.stat-val{font-family:'DM Mono',monospace;font-size:16px;font-weight:600;}
.stat-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-top:1px;}
#nav{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0;-webkit-overflow-scrolling:touch;}
#nav::-webkit-scrollbar{display:none;}
.nav-btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;padding:9px 11px;border-radius:6px 6px 0 0;cursor:pointer;border:1px solid transparent;border-bottom:none;white-space:nowrap;background:transparent;color:var(--muted);position:relative;bottom:-1px;transition:all 0.15s;}
.nav-btn.active{color:var(--accent);background:var(--surface);border-color:var(--border);border-bottom-color:var(--surface);}
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.tab{display:none;padding:16px;max-width:860px;}
.tab.active{display:block;}
.trade-card{background:var(--surface);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.trade-header{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.trade-body{padding:0 14px 14px;border-top:1px solid var(--surface2);}
.price-pills{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;}
.price-pill{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:5px 10px;text-align:center;}
.pill-lbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);text-transform:uppercase;margin-bottom:1px;}
.pill-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;}
.confirms{background:rgba(0,212,170,0.05);border:1px solid rgba(0,212,170,0.15);border-radius:7px;padding:8px 12px;margin-bottom:8px;}
.confirms-lbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--accent);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:4px;}
.footnote{background:rgba(123,97,255,0.08);border:1px solid rgba(123,97,255,0.2);border-radius:7px;padding:8px 12px;font-size:12px;color:#c4b5fd;margin-bottom:8px;}
.fn-lbl{font-family:'DM Mono',monospace;font-size:8px;color:#7b61ff;text-transform:uppercase;letter-spacing:0.12em;margin-bottom:4px;}
.badge{font-family:'DM Mono',monospace;font-size:9px;padding:2px 7px;border-radius:4px;}
.card-actions{display:flex;gap:7px;margin-top:10px;}
.btn-sm{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:6px;font-family:'DM Mono',monospace;font-size:9px;cursor:pointer;letter-spacing:0.06em;}
.btn-sm.danger{border-color:rgba(239,68,68,0.3);color:var(--red);}
.date-header{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.filter-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-btn{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.06em;text-transform:uppercase;padding:5px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--muted);}
.filter-btn.active{background:rgba(0,212,170,0.12);color:var(--accent);border-color:var(--accent);}
.watch-card{background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:9px;}
.watch-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
.watch-ticker{font-family:'DM Mono',monospace;font-size:17px;font-weight:700;}
.watch-meta{display:flex;gap:14px;font-size:11px;font-family:'DM Mono',monospace;}
#ai-tab{display:none;flex-direction:column;height:100%;}
#ai-tab.active{display:flex;}
.chips{padding:10px 16px 0;display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
.chip{background:rgba(0,212,170,0.08);border:1px solid rgba(0,212,170,0.2);color:var(--accent);border-radius:16px;padding:4px 11px;font-family:'DM Mono',monospace;font-size:9px;cursor:pointer;letter-spacing:0.04em;white-space:nowrap;}
.messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}
.msg{display:flex;}
.msg.user{justify-content:flex-end;}
.msg.assistant{justify-content:flex-start;}
.bubble{max-width:85%;padding:11px 14px;font-size:13px;line-height:1.6;border-radius:18px;}
.msg.user .bubble{background:var(--accent);color:#0d0f14;border-radius:18px 18px 4px 18px;font-weight:500;}
.msg.assistant .bubble{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 18px 4px;color:var(--text);}
.msg.assistant .bubble.had-action{border-left:3px solid var(--green);}
.typing{display:flex;gap:4px;align-items:center;padding:4px 0;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1s infinite;}
.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}
.input-area{padding:10px 16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;}
#chat-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 14px;font-size:14px;resize:none;line-height:1.5;}
#send-btn{background:var(--accent);color:#0d0f14;border:none;border-radius:10px;padding:10px 16px;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.06em;white-space:nowrap;transition:all 0.15s;}
#send-btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed;}
.section-card{background:var(--surface);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.section-title{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px;}
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:6px 10px;background:rgba(255,255,255,0.02);border-radius:6px;margin-bottom:5px;font-size:13px;cursor:pointer;}
.checklist-item input{width:14px;height:14px;flex-shrink:0;margin-top:2px;}
.rule-item{display:flex;align-items:flex-start;gap:10px;padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:6px;margin-bottom:5px;font-size:13px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;align-items:flex-start;justify-content:center;padding:20px 16px;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:500px;}
.modal-title{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px;}
.field{margin-bottom:10px;}
.field label{font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;display:block;margin-bottom:3px;}
.field input,.field textarea,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:8px 10px;font-size:13px;}
.field textarea{resize:vertical;min-height:68px;}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.btn-primary{flex:1;background:var(--accent);color:#0d0f14;border:none;padding:10px;border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;}
.btn-cancel{background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px 16px;border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;}
#toast{position:fixed;top:16px;right:16px;z-index:9999;padding:10px 16px;border-radius:8px;font-family:'DM Mono',monospace;font-size:12px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.5);transform:translateY(-10px);opacity:0;transition:all 0.25s;pointer-events:none;}
#toast.show{transform:translateY(0);opacity:1;}
.golden-rule{background:rgba(0,212,170,0.06);border:1px solid rgba(0,212,170,0.2);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;}
.golden-rule .lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:0.15em;margin-bottom:4px;}
.add-trade-btn{background:var(--accent);color:#0d0f14;border:none;border-radius:8px;padding:8px 16px;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
.add-trade-btn:active{opacity:0.85;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<div id="header">
  <div class="h-label">Smart Data Trading · Omen System</div>
  <div class="h-title">Merle's <span>Dashboard</span></div>
  <div class="h-sub">AI-powered · Standalone · Auto-saves <span id="saving-indicator" style="color:var(--accent);display:none">· Saving...</span></div>
  <div class="stats" id="stats-row"></div>
</div>

<div id="nav">
  <button class="nav-btn active" onclick="showTab('ai')">🤖 AI Assistant</button>
  <button class="nav-btn" onclick="showTab('log')">📋 Trade Log</button>
  <button class="nav-btn" onclick="showTab('watchlist')">👀 Watchlist</button>
  <button class="nav-btn" onclick="showTab('routine')">📅 Routine</button>
  <button class="nav-btn" onclick="showTab('rules')">⚠️ Rules</button>
</div>

<div id="content">
  <div id="ai-tab" class="active">
    <div class="chips" id="chips-row"></div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <textarea id="chat-input" rows="1" placeholder="Tell me about a trade, paste a Ben alert..."></textarea>
      <button id="send-btn" onclick="sendMessage()">SEND</button>
    </div>
  </div>

  <div id="log-tab" class="tab">
    <div class="filter-row" id="filter-row"></div>
    <div id="trade-list"></div>
  </div>

  <div id="watchlist-tab" class="tab">
    <div style="margin-bottom:12px;">
      <div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;">Omen Watchlist · Say "add X" in AI tab</div>
    </div>
    <div id="watchlist-list"></div>
  </div>

  <div id="routine-tab" class="tab">
    <div class="golden-rule">
      <div class="lbl">Golden Rule</div>
      Golden Sweep fires + Ben sends BOUGHT → <strong style="color:var(--green)">That's your trade.</strong>
    </div>
    <div id="routine-list"></div>
  </div>

  <div id="rules-tab" class="tab">
    <div id="rules-list"></div>
  </div>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title" id="modal-title-text">Edit Trade</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="field"><label>Ticker</label><input id="f-ticker" type="text" placeholder="GOOG"></div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="active">🟠 Active</option>
          <option value="win">✅ Win</option>
          <option value="loss">✗ Loss</option>
          <option value="watching">👀 Watching</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Contract</label><input id="f-contract" type="text" placeholder="Jun 18 $380 Call"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="field"><label>Date</label><input id="f-date" type="date"></div>
      <div class="field"><label>Source</label><input id="f-source" type="text" placeholder="B Sturg"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
      <div class="field"><label>Entry $</label><input id="f-entry" type="number" step="0.01"></div>
      <div class="field"><label>Stop $</label><input id="f-stop" type="number" step="0.01"></div>
      <div class="field"><label>T1 $</label><input id="f-t1" type="number" step="0.01"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div class="field"><label>Cost $</label><input id="f-cost" type="number"></div>
      <div class="field"><label>Result $</label><input id="f-result" type="number"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="f-notes" placeholder="What happened, lessons learned..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveEdit()">SAVE</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

}

function persist() {
  document.getElementById('saving-indicator').style.display='inline';
  lsSave(KEYS.trades, trades);
  lsSave(KEYS.watchlist, watchlist);
  setTimeout(()=>{ document.getElementById('saving-indicator').style.display='none'; }, 800);
}
function persistChat() { lsSave(KEYS.chat, chatHistory); }

function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = type==='error' ? '#ef4444' : '#00d4aa';
  el.style.color = '#0d0f14';
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2800);
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showTab(id) {
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    const ids=['ai','log','watchlist','routine','rules'];
    b.classList.toggle('active', ids[i]===id);
  });
  const aiTab = document.getElementById('ai-tab');
  const tabs = ['log','watchlist','routine','rules'];
  aiTab.classList.toggle('active', id==='ai');
  aiTab.style.display = id==='ai' ? 'flex' : 'none';
  tabs.forEach(t=>{
    document.getElementById(t+'-tab').classList.toggle('active', t===id);
  });
  if (id==='log') renderTradeLog();
  if (id==='watchlist') renderWatchlist();
}

function renderStats() {
  const active = trades.filter(t=>t.status==='active').length;
  const wins = trades.filter(t=>t.status==='win').length;
  const losses = trades.filter(t=>t.status==='loss').length;
  const pnl = trades.filter(t=>t.result!=null).reduce((a,t)=>a+Number(t.result),0);
  const stats = [
    {l:'Total',v:trades.length,c:'#e8eaf0'},
    {l:'Active',v:active,c:'#ff6b35'},
    {l:'Wins',v:wins,c:'#22c55e'},
    {l:'Losses',v:losses,c:'#ef4444'},
    {l:'P&L',v:(pnl>=0?'+':'')+'$'+pnl.toFixed(0),c:pnl>=0?'#22c55e':'#ef4444'},
  ];
  document.getElementById('stats-row').innerHTML = stats.map(s=>`
    <div class="stat">
      <div class="stat-val" style="color:${s.c}">${s.v}</div>
      <div class="stat-lbl">${s.l}</div>
    </div>`).join('');
}

function renderTradeLog() {
  const filters = ['all','active','win','loss','watching'];
  document.getElementById('filter-row').innerHTML = filters.map(f=>`
    <button class="filter-btn ${f===currentFilter?'active':''}" onclick="setFilter('${f}')">${f}</button>`).join('')
    + `<button class="add-trade-btn" onclick="openAddTrade()" style="margin-left:auto">+ Add Trade</button>`;

  const filtered = currentFilter==='all' ? trades : trades.filter(t=>t.status===currentFilter);
  const grouped = {};
  filtered.forEach(t=>{ const d=t.date||'unknown'; if(!grouped[d]) grouped[d]=[]; grouped[d].push(t); });
  const dates = Object.keys(grouped).sort((a,b)=>b.localeCompare(a));

  document.getElementById('trade-list').innerHTML = dates.map(date=>`
    <div class="date-header">${date}</div>
    ${grouped[date].map(t=>tradeCardHTML(t)).join('')}
  `).join('') || '<div style="text-align:center;color:var(--muted);padding:40px;font-family:monospace;">No trades match filter</div>';
}

function toggleCard(id) {
  if (expandedCards.has(id)) expandedCards.delete(id);
  else expandedCards.add(id);
  renderTradeLog();
}
function setFilter(f) { currentFilter=f; renderTradeLog(); }

function deleteTrade(id) {
  if (!confirm('Delete this trade?')) return;
  trades = trades.filter(t=>t.id!==id);

  toast('Trade deleted');
}

function saveEdit() {
  const result = document.getElementById('f-result').value;
  const ticker = document.getElementById('f-ticker').value.toUpperCase();
  if (!ticker) { toast('Ticker required','error'); return; }
  const tradeData = {
    ticker,
    status: document.getElementById('f-status').value,
    contract: document.getElementById('f-contract').value,
    entry: parseFloat(document.getElementById('f-entry').value)||null,
    stop: parseFloat(document.getElementById('f-stop').value)||null,
    t1: parseFloat(document.getElementById('f-t1').value)||null,
    cost: parseFloat(document.getElementById('f-cost').value)||null,
    result: result!=='' ? parseFloat(result) : null,
    notes: document.getElementById('f-notes').value,
    date: document.getElementById('f-date').value || new Date().toISOString().slice(0,10),
    source: document.getElementById('f-source').value,
  };
  if (editingId) {
    trades = trades.map(t => t.id===editingId ? {...t,...tradeData} : t);
    toast('Trade updated ✓');
  } else {
    const newTrade = { id:'trade-'+Date.now(), confirmations:[], footnote:'', ...tradeData };
    trades = [newTrade, ...trades];
    expandedCards.add(newTrade.id);
    toast('Trade added ✓');
  }
  persist(); renderStats(); renderTradeLog();
  closeModal();
}

function buildSystemPrompt() {
  return `You are Merle's personal trading assistant embedded in her standalone options trading dashboard.
You update her trade log and watchlist by returning JSON commands.

CURRENT TRADE LOG:
${JSON.stringify(trades, null, 2)}

CURRENT WATCHLIST:
${JSON.stringify(watchlist, null, 2)}

TODAY: ${new Date().toISOString().slice(0,10)}

Be concise and direct — she's trading. Always confirm what you did briefly.

RESPONSE FORMAT — return ONLY valid JSON:
{
  "message": "Brief reply here",
  "actions": [
    { "type": "ADD_TRADE", "trade": { "ticker":"AMZN","contract":"Jul 17 $290 Call","source":"B Sturg","status":"active","entry":3.40,"stop":2.38,"t1":4.76,"cost":340,"notes":"...","confirmations":["..."],"footnote":"" } },
    { "type": "UPDATE_TRADE", "id": "amzn-002", "updates": { "status":"win","result":136,"resultPct":40,"notes":"Closed at T1" } },
    { "type": "ADD_WATCHLIST", "item": { "ticker":"NKE","contract":"Jun 18 $46 Call","trigger":42.85,"current":42.50,"status":"triggered","notes":"..." } },
    { "type": "UPDATE_WATCHLIST", "id": "nke-w1", "updates": { "current":43.10 } },
    { "type": "REMOVE_WATCHLIST", "id": "nke-w1" }
  ]
}

Status values: "active","win","loss","watching","watchlist"
No actions needed? Use: "actions":[]
Return ONLY the JSON — no markdown, no backticks.`;
}

function applyActions(actions) {
  const log = [];
  actions.forEach(action => {
    if (action.type==='ADD_TRADE') {
      const t = { id:'trade-'+Date.now()+Math.random().toString(36).slice(2,5), date:new Date().toISOString().slice(0,10), confirmations:[], footnote:'', ...action.trade };
      trades = [t, ...trades];
      expandedCards.add(t.id);
      log.push('✅ Logged '+t.ticker+' trade');
    } else if (action.type==='UPDATE_TRADE') {
      trades = trades.map(t => t.id===action.id ? {...t,...action.updates} : t);
      const ticker = trades.find(t=>t.id===action.id)?.ticker||action.id;
      log.push('✅ Updated '+ticker);
    } else if (action.type==='ADD_WATCHLIST') {
      const w = { id:'w-'+Date.now(), ...action.item };
      watchlist = [w, ...watchlist];
      log.push('👀 Added '+w.ticker+' to watchlist');
    } else if (action.type==='UPDATE_WATCHLIST') {
      watchlist = watchlist.map(w => w.id===action.id ? {...w,...action.updates} : w);
      log.push('✅ Updated watchlist');
    } else if (action.type==='REMOVE_WATCHLIST') {
      const removed = watchlist.find(w=>w.id===action.id);
      watchlist = watchlist.filter(w=>w.id!==action.id);
      if (removed) log.push('🗑 Removed '+removed.ticker);
    }
  });
  persist();
  renderStats();
  renderWatchlist();
  renderTradeLog();
  return log;
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || aiLoading) return;
  input.value = '';
  input.style.height = 'auto';

  chatHistory.push({ role:'user', content:text, ts:new Date().toISOString() });
  persistChat();
  aiLoading = true;
  renderMessages();
  document.getElementById('send-btn').disabled = true;

  try {
    const apiMessages = chatHistory.slice(-10).map(m=>({ role:m.role, content:m.content }));
    
    // Try direct first, fall back to proxy
    let data;
    const payload = {
      model:'claude-sonnet-4-20250514',
      max_tokens:1000,
      system: buildSystemPrompt(),
      messages: apiMessages,
    };

    const headers = {
      'Content-Type':'application/json',
      'x-api-key': API_KEY,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    };

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', headers, body: JSON.stringify(payload)
      });
      data = await res.json();
      if (data.error) throw new Error(data.error.message);
    } catch(e) {
      // Fall back to corsproxy.io
      const res2 = await fetch('https://corsproxy.io/?https://api.anthropic.com/v1/messages', {
        method:'POST', headers, body: JSON.stringify(payload)
      });
      data = await res2.json();
      if (data.error) throw new Error(data.error.message);
    }

    const raw = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('') || '{}';

    let parsed;
    try { parsed = JSON.parse(raw.replace(/```json|```/g,'').trim()); }
    catch { parsed = { message: raw, actions:[] }; }

    let actionLog = [];
    if (parsed.actions && parsed.actions.length > 0) {
      actionLog = applyActions(parsed.actions);
      if (actionLog.length) toast('Dashboard updated ✓');
    }

    const reply = parsed.message + (actionLog.length ? '\n\n'+actionLog.join('\n') : '');
    chatHistory.push({ role:'assistant', content:reply, ts:new Date().toISOString(), hadAction: actionLog.length>0 });
    persistChat();
  } catch(err) {
    console.error('AI error:', err);
    // Fallback: parse the message manually for common commands
    const text2 = chatHistory[chatHistory.length-1]?.content || '';
    const fallbackReply = tryManualParse(text2);
    chatHistory.push({ role:'assistant', content: fallbackReply, ts:new Date().toISOString() });
    persistChat();
  }

  aiLoading = false;
  document.getElementById('send-btn').disabled = false;
  renderMessages();
}

// Manual parser as fallback when API is unreachable
function tryManualParse(text) {
  const t = text.toLowerCase();
  
  // "log TICKER win/loss $X" pattern
  const logMatch = text.match(/log\s+([A-Z]+)\s+(win|loss|active)/i);
  const resultMatch = text.match(/\$?([\-\d]+)\s*(?:result|profit|loss|p&l)?/i);
  const entryMatch = text.match(/entry\s*\$?([\d.]+)/i);
  const contractMatch = text.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\s*\d+\s*\$[\d.]+\s*(call|put)/i);

  if (logMatch) {
    const ticker = logMatch[1].toUpperCase();
    const status = logMatch[2].toLowerCase();
    const result = resultMatch ? parseFloat(resultMatch[1]) : null;
    const newTrade = {
      id: 'trade-'+Date.now(),
      date: new Date().toISOString().slice(0,10),
      ticker,
      status,
      contract: contractMatch ? contractMatch[0] : '',
      entry: entryMatch ? parseFloat(entryMatch[1]) : null,
      result,
      confirmations: [],
      footnote: '',
      notes: 'Logged via manual command'
    };
    trades = [newTrade, ...trades];
    expandedCards.add(newTrade.id);
    persist(); renderStats(); renderTradeLog();
    toast('Trade logged ✓');
    return `✅ Logged ${ticker} as ${status}${result ? ' · Result: $'+result : ''}.\n\n(AI offline — used quick-log mode)`;
  }

  return '⚠️ AI connection issue. Try again in a moment, or use the + Add Trade button in the Log tab.';
}
